services:
  app:
    image: ramdhanistars/whatsappui:1.0.0
    ports:
      - "3321:3000"
    env_file:
      - .env.dockhand
    depends_on:
      db-temp:
        condition: service_healthy
    volumes:
      - whatsapp_data:/app/data

  # Database Temporary di VM 1 (Local Failover DB)
  db-temp:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_TEMP_DB:-whatsapp_temp}
    env_file:
      - .env.dockhand
    volumes:
      - postgres_temp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_TEMP_DB:-whatsapp_temp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  whatsapp_data:
  postgres_temp_data:
