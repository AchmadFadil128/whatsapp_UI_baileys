services:
  app:
    build: .
    ports:
      - "3321:3000"
    env_file:
      - .env.dockhand
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whatsapp_data:/app/data

  db:
    image: postgres:15-alpine
    env_file:
      - .env.dockhand
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  whatsapp_data:
  postgres_data:
